<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#0d0d0d;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0d0d0d;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:8px;padding:32px;">
            <tr>
              <td style="text-align:center;padding-bottom:16px;">
                <p style="margin:0;color:#e5c000;font-size:28px;font-weight:700;letter-spacing:2px;">GYMX</p>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:16px;">
                <h1 style="margin:0;color:#f5f5f5;font-size:22px;line-height:1.3;">
                  Autorize o cadastro de {{ .Data.full_name }}
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <p style="margin:0;color:#a3a3a3;font-size:15px;line-height:1.6;">
                  Recebemos um pedido de cadastro para <strong style="color:#f5f5f5;">{{ .Email }}</strong>.
                  Clique no botão abaixo para abrir a tela de verificação e autorizar a conta.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e5c000;color:#1a1400;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:14px 28px;border-radius:8px;">
                  Autorizar cadastro
                </a>
              </td>
            </tr>
            <tr>
              <td>
                <p style="margin:0;color:#737373;font-size:12px;line-height:1.5;">
                  Se você não fez este cadastro, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
